site_name: PMDM - Programación Multimedia y Dispositivos Móviles
site_url: 'https://ismaelvelasco-star.github.io/di-desarrollo-interfaces'
repo_url: 'https://github.com/ismaelvelasco-star/di-desarrollo-interfaces'
repo_name: 'ismaelvelasco-star/di-desarrollo-interfaces'
edit_uri: edit/main/docs/
site_author: 'Ismael Velasco'
site_description: Temario del módulo 0489 PMDM con Kotlin y Android

nav:
  - 'Principal': 'index.md'
  - 'PMDM':
    - 'section1/index.md'
    - 'U1: Análisis de tecnologías para dispositivos móviles':
        - 'section1/u01/index.md'
        - '1.1.-Análisis de tecnologías para dispositivos móviles': 'section1/u01/teoria/PMDM-U1.1.-AnalisisTecnologiasDispositivosMoviles.md'
        - 'Práctica 1.1: Explorando Android Studio y sus plantillas': 'section1/u01/practica/PMDM-U1.-Practica001.md'
        - 'Práctica 1.2: Emuladores y perfiles de dispositivo': 'section1/u01/practica/PMDM-U1.-Practica002.md'
        - 'Práctica 1.3: ADB y el administrador de aplicaciones': 'section1/u01/practica/PMDM-U1.-Practica003.md'
  - 'Acerca de': 'about.md'

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: es
